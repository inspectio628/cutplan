<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>컷플랜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 상단 단계 탭 + 본문. 넓은 화면은 입력(좌) / 프롬프트·이미지(우) 2단, 좁은 화면은 1단. */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --ink:#18212b; --muted:#5d6b7a; --line:#d8dee4;
  --accent:#0e6f68; --accent-ink:#ffffff; --accent-soft:#dff1ef; --mark:#e0a800; --danger:#b42318; --ok:#1a7f4b;
  --f-display:"Gowun Batang","Noto Serif KR","Batang",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181e; --surface:#1b242d; --ink:#e8edf1; --muted:#9aa8b5; --line:#2c3844;
  --accent:#4fc3b9; --accent-ink:#0a1a18; --accent-soft:#1a3532; --mark:#f0c13a; --danger:#ff8a7a; --ok:#5fd394; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181e; --surface:#1b242d; --ink:#e8edf1; --muted:#9aa8b5; --line:#2c3844;
  --accent:#4fc3b9; --accent-ink:#0a1a18; --accent-soft:#1a3532; --mark:#f0c13a; --danger:#ff8a7a; --ok:#5fd394; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
header.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:18px 0 10px}
header.top h1{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance}
header.top p{margin:0;color:var(--muted);font-size:13px}
.saved{margin-left:auto;font-size:12px;color:var(--muted)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;background:var(--bg);padding:6px 0;border-bottom:1px solid var(--line);overflow-x:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:9px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav.tabs button .n{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:var(--line);color:var(--ink);font-size:12px;margin-right:6px}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
nav.tabs button[aria-selected="true"] .n{background:var(--accent);color:var(--accent-ink)}
main{padding:18px 0 60px;display:block}
h2{font-family:var(--f-display);font-size:20px;margin:0 0 4px}
h3{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.lead{color:var(--muted);margin:0 0 16px;max-width:65ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.split .stick{position:sticky;top:64px}
@media(max-width:820px){.split{grid-template-columns:minmax(0,1fr)}.split .stick{position:static}}
label{display:block;font-size:13px;font-weight:500;margin-bottom:4px}
label .req{color:var(--danger)}
.field{margin-bottom:12px;min-width:0}
input[type=text],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
textarea{resize:vertical;min-height:72px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tip{font-size:12px;color:var(--muted);margin:4px 0 0;min-height:18px}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin-bottom:6px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"],.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.add{border-style:dashed;color:var(--muted)}
.state{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.promptbox{font-family:var(--f-body);font-size:14px;line-height:1.65;min-height:190px}
.dropzone{border:2px dashed var(--line);border-radius:10px;min-height:150px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:12px;cursor:pointer;background:var(--bg)}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.imgframe{width:100%;background:#000;border-radius:8px;overflow:hidden;position:relative}
.imgframe img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.warn{background:color-mix(in srgb,var(--mark) 18%,var(--surface));border:1px solid var(--mark);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.hist .v{font-weight:700;color:var(--accent);margin-right:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .meta{font-size:12px;color:var(--muted)}
.card .scene{font-size:14px;margin:0}
.empty{display:grid;place-items:center;height:100%;color:#8a97a3;font-size:13px;text-align:center;padding:8px}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.pages img{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
.check{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px;font-size:14px}
.check input{margin-top:5px}
details.help{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 14px;margin-bottom:16px}
details.help summary{cursor:pointer;font-weight:700}
details.help table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
details.help td,details.help th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>컷플랜</h1>
    <p>시 · 소설 · 시나리오를 컷으로 옮기고, 이미지 생성용 프롬프트를 조립하는 스토리보드 도구</p>
    <span class="saved" id="saved" role="status"></span>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="작업 단계"></nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ===== 데이터 사전: [화면에 보이는 말, 영어 키워드, 한 줄 설명] ===== */
const OPT = {
  shot: [
    ['익스트림 롱샷','extreme long shot','인물이 아주 작게 보이고 공간이 압도한다. 고독, 막막함, 거대한 배경.'],
    ['롱샷','long shot','인물과 주변 공간이 함께 보인다. 상황과 장소를 알려 준다.'],
    ['풀샷','full shot','인물의 전신이 보인다. 몸짓과 자세로 감정을 전한다.'],
    ['미디엄샷','medium shot','허리 위쪽. 대화와 행동을 가장 자연스럽게 보여 준다.'],
    ['미디엄 클로즈업','medium close-up','가슴 위쪽. 표정과 감정에 집중하기 시작한다.'],
    ['클로즈업','close-up','얼굴이나 사물 하나를 크게. 감정과 상징을 강조한다.'],
    ['익스트림 클로즈업','extreme close-up','눈, 손끝처럼 아주 일부. 긴장감과 디테일을 강조한다.']
  ],
  angle: [
    ['아이레벨','eye-level angle','눈높이. 중립적이고 현실감이 있다.'],
    ['로우앵글','low angle','아래에서 위로. 인물이 크고 강하게, 또는 위압적으로 보인다.'],
    ['하이앵글','high angle','위에서 아래로. 인물이 작고 약하게, 무력하게 보인다.'],
    ['버즈아이(항공 시점)','bird\'s-eye view','바로 위에서 내려다본다. 전체 배치와 운명적인 느낌.'],
    ['더치앵글(기울임)','Dutch angle','화면을 기울인다. 불안, 혼란.'],
    ['오버더숄더','over-the-shoulder shot','한 인물의 어깨 너머로 상대를 본다. 관계와 시선.'],
    ['인물 시점(POV)','point-of-view shot','인물이 보는 장면 그대로. 몰입감.']
  ],
  comp: [
    ['삼분할','rule of thirds composition','화면을 3등분한 선과 교차점에 주인공을 둔다. 안정적이고 자연스럽다.'],
    ['중앙 배치','centered composition','가운데에 놓는다. 강조, 정면 대결, 정적인 느낌.'],
    ['대칭','symmetrical composition','좌우가 균형. 질서, 긴장, 숨 막히는 분위기.'],
    ['프레임 속 프레임','frame within a frame','문, 창문 등으로 한 번 더 감싼다. 갇힘, 엿보기.'],
    ['넓은 여백','negative space','빈 공간을 크게 남긴다. 외로움, 여운.'],
    ['전경 활용','foreground framing','앞쪽 사물이 인물을 가린다. 깊이감, 거리감.'],
    ['대각선','diagonal composition','대각선 배치. 움직임, 불안정.']
  ],
  light: [
    ['자연광','natural light',''],['역광','backlight',''],['측광','side lighting',''],
    ['노을빛','golden hour light',''],['푸른 새벽빛','blue hour light',''],
    ['흐린 날의 부드러운 빛','soft overcast light',''],['어두운 실내(저조도)','low-key lighting',''],['밝고 선명한 빛','high-key lighting','']
  ],
  tone: [
    ['따뜻한 톤','warm tones'],['차가운 톤','cool tones'],['저채도','desaturated colors'],
    ['흑백','black and white'],['선명한 색','vivid colors'],['파스텔','pastel colors']
  ],
  style: [
    ['실사 영화 스틸','cinematic film still'],['수채화','watercolor illustration'],
    ['흑백 필름 사진','black and white film photograph'],['웹툰풍','webtoon style illustration'],
    ['애니메이션풍','animation style illustration'],['연필 스케치','pencil sketch'],['유화','oil painting']
  ],
  ratio: ['16:9','4:3','2.39:1','1:1','9:16'],
  src: ['AI 생성','직접 촬영','스케치'],
  status: ['작성 중','프롬프트 완료','이미지 생성됨','수정 중','완료'],
  reasons: ['앵글','샷 크기','구도','분위기·색감','인물 묘사','배경','기타']
};
const EN = (group, ko) => { const r = OPT[group].find(o => o[0] === ko); return r ? r[1] : ''; };
const TIP = (group, ko) => { const r = OPT[group].find(o => o[0] === ko); return r && r[2] ? r[2] : ''; };

/* ===== 상태 ===== */
const uid = () => Math.random().toString(36).slice(2, 9);
const newCut = () => ({ id: uid(), verse: '', scene: '', chars: [], place: '', shot: '', angle: '', comp: '', light: '', tone: '', mood: '',
  intent: '', sound: '', src: 'AI 생성', status: '작성 중', edited: false, override: '', hist: [], img: '', example: false });
const blank = () => ({
  meta: { poem: '', poet: '', author: '', ratio: '16:9', style: '실사 영화 스틸', styleNote: '', lang: 'ko' },
  chars: [], cuts: [newCut()], sel: 0,
  reflect: { keep: '', add: '', drop: '', gap: '', lesson: '', decided: { look: false, angle: false, mood: false, order: false }, tool: '' }
});
const example = () => {
  const s = blank();
  s.meta.poem = '예시: 비 오는 정류장'; s.meta.poet = '(예시)'; s.meta.author = '';
  s.chars = [{ id: 'c1', name: '소녀', look: '단발머리, 노란 우산, 회색 교복' }];
  const c = newCut(); c.example = true;
  Object.assign(c, { verse: '(여기에 시 구절을 적어요)', scene: '비가 그친 저녁, 소녀가 빈 정류장 의자에 혼자 앉아 접힌 우산을 무릎에 올려 두고 있다.',
    chars: ['c1'], place: '비 갠 뒤 젖은 정류장, 해 질 무렵', shot: '미디엄샷', angle: '하이앵글', comp: '넓은 여백', light: '노을빛', tone: '차가운 톤',
    mood: '쓸쓸하지만 조금 후련한', intent: '하이앵글을 쓴 이유는 소녀가 세상 속에서 작고 외로워 보이게 하여 시의 쓸쓸한 정서를 살리기 위해서다.' });
  s.cuts = [c]; return s;
};
let S = blank();
let view = 'setup';

/* ===== 저장 (IndexedDB, 실패해도 동작) ===== */
const DB = { name: 'cutplan', store: 'kv' };
const idb = () => new Promise((res, rej) => {
  try { const r = indexedDB.open(DB.name, 1); r.onupgradeneeded = () => r.result.createObjectStore(DB.store); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
  catch (e) { rej(e); }
});
const idbGet = async () => { try { const d = await idb(); return await new Promise(res => { const q = d.transaction(DB.store).objectStore(DB.store).get('state'); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; } };
const idbPut = async v => { try { const d = await idb(); await new Promise((res, rej) => { const t = d.transaction(DB.store, 'readwrite'); t.objectStore(DB.store).put(v, 'state'); t.oncomplete = res; t.onerror = rej; }); return true; } catch (e) { return false; } };
let saveTimer = 0;
const save = () => { clearTimeout(saveTimer); saveTimer = setTimeout(async () => {
  const ok = await idbPut(JSON.parse(JSON.stringify(S)));
  $('#saved').textContent = ok ? '이 기기에 자동 저장됨' : '자동 저장을 쓸 수 없어요. 작업 코드를 직접 복사해 두세요.';
}, 500); };

/* ===== 도우미 ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cut = () => S.cuts[S.sel] || S.cuts[0];
let toastT = 0;
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); };
const opts = (arr, cur, ph) => `<option value="">${ph || '선택'}</option>` + arr.map(o => { const v = Array.isArray(o) ? o[0] : o; return `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(v)}</option>`; }).join('');
const copyText = async (text, ta) => {
  try { await navigator.clipboard.writeText(text); toast('복사했어요'); return; } catch (e) {}
  try { if (ta) { ta.focus(); ta.select(); if (document.execCommand('copy')) { toast('복사했어요'); return; } } } catch (e) {}
  if (ta) { ta.focus(); ta.select(); }
  toast('길게 눌러 복사해 주세요');
};

/* ===== 프롬프트 조립 ===== */
function build(c) {
  const m = S.meta, L = [];
  const ratioLbl = { '16:9': '가로형', '4:3': '가로형', '2.39:1': '와이드 시네마', '1:1': '정사각형', '9:16': '세로형' }[m.ratio] || '';
  L.push(`${m.style || '영화 장면'} 느낌의 이미지 한 장을 만들어 주세요. 화면 비율은 ${m.ratio}(${ratioLbl})입니다.`);
  if (c.scene.trim()) L.push(`장면: ${c.scene.trim()}`);
  const who = S.chars.filter(x => c.chars.includes(x.id)).map(x => x.look ? `${x.name}(${x.look})` : x.name);
  if (who.length) L.push(`등장인물: ${who.join(', ')}`);
  if (c.place.trim()) L.push(`배경·시간: ${c.place.trim()}`);
  const cam = [c.shot, c.angle, c.comp && `${c.comp} 구도`].filter(Boolean);
  if (cam.length) L.push(`카메라: ${cam.join(', ')}`);
  const lt = [c.light, c.tone].filter(Boolean);
  if (lt.length) L.push(`빛과 색감: ${lt.join(', ')}`);
  if (c.mood.trim()) L.push(`분위기: ${c.mood.trim()}`);
  if (m.styleNote.trim()) L.push(`추가 스타일: ${m.styleNote.trim()}`);
  L.push('이미지 안에 글자, 로고, 워터마크는 넣지 말아 주세요.');
  let out = L.join('\n');
  if (m.lang === 'both') {
    const kw = [EN('style', m.style) || 'cinematic still', EN('shot', c.shot), EN('angle', c.angle), EN('comp', c.comp), EN('light', c.light), EN('tone', c.tone)].filter(Boolean);
    out += `\n\nEnglish keywords: ${kw.join(', ')}, aspect ratio ${m.ratio}, no text, no logo, no watermark`;
  }
  return out;
}
const promptOf = c => (c.edited && c.override) ? c.override : build(c);
const missing = c => { const m = []; if (!c.scene.trim()) m.push('장면 설명'); if (!c.shot) m.push('샷 크기'); if (!c.angle) m.push('앵글'); if (!c.intent.trim()) m.push('연출 의도'); return m; };

/* ===== 이미지 축소 ===== */
const shrink = file => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onerror = () => rej(new Error('read'));
  fr.onload = () => { const im = new Image(); im.onerror = () => rej(new Error('img')); im.onload = () => {
    const k = Math.min(1, 1400 / Math.max(im.width, im.height)); const cv = document.createElement('canvas');
    cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
    const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(im, 0, 0, cv.width, cv.height);
    res(cv.toDataURL('image/jpeg', 0.85)); }; im.src = fr.result; };
  fr.readAsDataURL(file);
});

/* ===== 초안 가져오기: 빈 줄 또는 번호로 컷 분할 ===== */
function splitDraft(t) {
  t = t.replace(/\r/g, '').trim(); if (!t) return [];
  let parts = t.split(/\n\s*\n+/);
  if (parts.length < 2) parts = t.split(/\n(?=\s*(?:#?\s*\d{1,2}\s*[\).:·]|컷\s*\d{1,2}|S#\s*\d{1,2}))/i);
  if (parts.length < 2) parts = t.split(/\n/);
  return parts.map(p => p.replace(/^\s*(?:#?\s*\d{1,2}\s*[\).:·]|컷\s*\d{1,2}\s*[\).:·]?|S#\s*\d{1,2}\s*[\).:·]?)\s*/i, '').trim()).filter(Boolean).slice(0, 20);
}

const dec = s => { s = s.trim(); if (s.startsWith('CUTPLAN1:')) s = s.slice(9); else if (s[0] === '{') return JSON.parse(s); return JSON.parse(decodeURIComponent(escape(atob(s)))); };
const textOnly = () => { const o = JSON.parse(JSON.stringify(S)); o.cuts.forEach(c => { c.img = ''; }); return o; };
const normalize = o => { const b = blank(); const s = Object.assign(b, o); s.meta = Object.assign(b.meta, o.meta || {}); s.reflect = Object.assign(b.reflect, o.reflect || {});
  s.reflect.decided = Object.assign(b.reflect.decided, (o.reflect || {}).decided || {}); s.chars = o.chars || []; s.cuts = (o.cuts && o.cuts.length ? o.cuts : [newCut()]).map(c => Object.assign(newCut(), c)); s.sel = Math.min(o.sel || 0, s.cuts.length - 1); return s; };

  try { const c = cut(); c.img = await shrink(f); if (['작성 중', '프롬프트 완료', '수정 중'].includes(c.status)) c.status = '이미지 생성됨'; c.example = false; save(); render(); toast('이미지를 올렸어요'); } catch (er) { toast('이 이미지를 읽지 못했어요'); }
});
let reasonPick = '';
V.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'goto') return go(b.dataset.v);
  if (a === 'reset') { S = blank(); save(); return render(); }
  if (a === 'addChar') { S.chars.push({ id: uid(), name: '', look: '' }); save(); return render(); }
  if (a === 'delChar') { const id = S.chars[i].id; S.chars.splice(i, 1); S.cuts.forEach(c => { c.chars = c.chars.filter(x => x !== id); }); save(); return render(); }
  if (a === 'split') {
    const parts = splitDraft($('#draft').value); if (!parts.length) { $('#splitmsg').textContent = '내용을 먼저 입력해 주세요.'; return; }
    const keep = S.cuts.filter(c => !c.example && (c.scene || c.verse || c.img));
    const made = parts.map(p => { const c = newCut(); c.scene = p; return c; });
    S.cuts = keep.concat(made); S.sel = keep.length; save(); toast(`${made.length}컷으로 나눴어요`); return go('cuts');
  }
  if (a === 'addCut' || a === 'addCut2') { S.cuts.push(newCut()); S.sel = S.cuts.length - 1; save(); return go('cuts'); }
  if (a === 'selCut') { S.sel = i; save(); return render(); }
  if (a === 'editCut') { S.sel = i; save(); return go('cuts'); }
  if (a === 'toggleChar') { const c = cut(), id = b.dataset.id; c.chars = c.chars.includes(id) ? c.chars.filter(x => x !== id) : c.chars.concat(id); b.setAttribute('aria-pressed', c.chars.includes(id)); refreshPrompt(); return save(); }
  if (a === 'copyPrompt') { const c = cut(); await copyText($('#pbox').value, $('#pbox')); if (c.status === '작성 중' && !missing(c).length) { c.status = '프롬프트 완료'; const s = $('#c-status'); if (s) s.value = c.status; save(); } return; }
  if (a === 'resetPrompt') { const c = cut(); c.edited = false; c.override = ''; refreshPrompt(); return save(); }
  if (a === 'reason') { reasonPick = b.dataset.r; $$('#rchips .chip').forEach(x => x.setAttribute('aria-pressed', x === b)); return; }
  if (a === 'saveVer') { const c = cut(), txt = $('#rtext').value.trim(); c.hist.push({ v: c.hist.length + 1, prompt: promptOf(c), reason: [reasonPick, txt].filter(Boolean).join(': ') }); if (c.status === '이미지 생성됨') c.status = '수정 중'; const s = $('#c-status'); if (s) s.value = c.status; $('#rtext').value = ''; reasonPick = ''; $$('#rchips .chip').forEach(x => x.setAttribute('aria-pressed', 'false')); refreshHist(); toast(`v${c.hist.length}로 기록했어요`); return save(); }
  if (a === 'copyVer') { await copyText(cut().hist[i].prompt); return; }
  if (a === 'delImg') { cut().img = ''; $('#imgarea').innerHTML = imgHtml(cut()) + '<input id="imgfile" type="file" accept="image/*" hidden>'; return save(); }
  if (a === 'move') { const d = +b.dataset.d, j = i + d; if (j < 0 || j >= S.cuts.length) return; [S.cuts[i], S.cuts[j]] = [S.cuts[j], S.cuts[i]]; S.sel = j; save(); return render(); }
  if (a === 'dup') { const c = JSON.parse(JSON.stringify(S.cuts[i])); c.id = uid(); c.hist = []; c.example = false; S.cuts.splice(i + 1, 0, c); S.sel = i + 1; save(); return render(); }
  if (a === 'del') { const c = S.cuts[i]; if (X.delId !== c.id) { X.delId = c.id; return render(); } X.delId = ''; S.cuts.splice(i, 1); if (!S.cuts.length) S.cuts.push(newCut()); S.sel = Math.min(S.sel, S.cuts.length - 1); save(); return render(); }
  if (a === 'copyCode') { const ta = document.createElement('textarea'); ta.value = enc(textOnly()); ta.style.cssText = 'position:fixed;left:-9999px'; document.body.appendChild(ta); await copyText(ta.value, ta); ta.remove(); return; }
  if (a === 'saveFile') return saveBlob(JSON.stringify(S), 'json');
  if (a === 'importCode') { try { loadState(dec($('#codein').value)); toast('작업을 불러왔어요'); } catch (er) { toast('코드를 읽지 못했어요. 처음부터 끝까지 복사했는지 확인해 주세요'); } return; }
  if (a === 'makePdf') return makePdf();
  if (a === 'savePdf') return X.blob && saveBlob(X.blob, 'pdf');
  if (a === 'zoom') { if (!X.pages[i]) return; const o = document.createElement('div'); o.style.cssText = 'position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.88);overflow:auto;padding:max(12px,env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))'; o.innerHTML = `<p style="color:#fff;font-size:13px;margin:0 0 8px">이미지를 길게 눌러 저장하거나 화면을 캡처하세요. 아무 곳이나 짧게 누르면 닫혀요.</p><img src="${X.pages[i]}" alt="PDF ${i + 1}쪽 크게 보기" style="width:100%;max-width:1100px;display:block;margin:0 auto;background:#fff">`; o.onclick = () => o.remove(); document.body.appendChild(o); return; }
  if (a === 'savePage') return X.pages[i] && saveBlob(dataUrlToBlob(X.pages[i]), 'jpg', fname('jpg').replace('.jpg', `_${i + 1}쪽.jpg`));
});

/* 상단 단계 탭: 어느 단계로든 이동 */
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-act="goto"]'); if (b) go(b.dataset.v); });

/* ===== 시작 ===== */
(async () => {
  const saved = await idbGet();
  S = saved ? normalize(saved) : example();
  render();
  $('#saved').textContent = '';
  X.canSave = true;
  if (X.canSave === false && view === 'out') render();
})();
